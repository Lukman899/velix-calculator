
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VELIX CALCULATOR</title>
    <link rel="stylesheet" href="output.css">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');

        :root {
            --bg: #111111;
            --card: #1c1c1c;
            --display: #252525;
            --text: #f5f5f5;
            --muted: #a5a5a5;
            --border: #353535;
            --accent: #e53935;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
        }

        header {
            width: 100%;
            border-bottom: 1px solid var(--border);
        }

        .navbar {
            max-width: 1150px;
            margin: auto;
            padding: 25px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 24px;
            font-weight: 900;
            letter-spacing: -1px;
        }

        .logo span {
            color: var(--accent);
        }

        .nav-text {
            font-size: 12px;
            font-weight: 700;
            color: var(--muted);
            letter-spacing: 1px;
        }

        main {
            width: 100%;
            max-width: 1150px;
            margin: auto;
            padding: 65px 20px 90px;
        }

        .page-heading {
            text-align: center;
            margin-bottom: 45px;
        }

        .page-heading p {
            color: var(--accent);
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 2px;
            margin-bottom: 15px;
        }

        .page-heading h1 {
            font-size: clamp(35px, 6vw, 55px);
            font-weight: 900;
            letter-spacing: -2px;
            line-height: 1.2;
            margin-bottom: 15px;
        }

        .page-heading h1 span {
            color: var(--accent);
        }

        .page-heading .description {
            color: var(--muted);
            font-size: 14px;
            letter-spacing: normal;
            font-weight: 400;
            margin-bottom: 0;
        }

        .calculator {
            width: 100%;
            max-width: 380px;
            margin: auto;
            padding: 25px;
            background-color: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
        }

        .calculator-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 22px;
        }

        .calculator-name {
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 1px;
        }

        .calculator-model {
            font-size: 11px;
            font-weight: 600;
            color: var(--muted);
        }

        .display-container {
            margin-bottom: 25px;
        }

        .display-container input {
            display: block;
            width: 100%;
            height: 85px;
            padding: 18px;
            background-color: var(--display);
            color: var(--text);
            border: 1px solid #454545;
            border-radius: 7px;
            font-family: inherit;
            font-size: 32px;
            font-weight: 600;
            text-align: right;
            outline: none;
            min-width: 0;
        }

        .display-container input::placeholder {
            color: #777777;
            opacity: 1;
        }

        .display-container input:focus {
            border-color: var(--accent);
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 12px;
        }

        .buttons button {
            width: 100%;
            aspect-ratio: 1;
            border: 1px solid #444444;
            border-radius: 50%;
            background-color: #303030;
            color: var(--text);
            font-family: inherit;
            font-size: 19px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.15s,
                        transform 0.15s;
        }

        .buttons button:hover {
            background-color: #484848;
        }

        .buttons button:active {
            transform: scale(0.94);
        }

        .buttons .function {
            background-color: #444444;
            color: #ffffff;
            font-size: 15px;
            font-weight: 700;
        }

        .buttons .function:hover {
            background-color: #555555;
        }

        .buttons .operator {
            background-color: #842522;
            border-color: #a42c29;
            color: #ffffff;
            font-size: 23px;
        }

        .buttons .operator:hover {
            background-color: var(--accent);
        }

        .buttons .equal {
            background-color: var(--accent);
            border-color: var(--accent);
            color: white;
            font-size: 25px;
            font-weight: 800;
        }

        .buttons .equal:hover {
            background-color: #c62828;
        }

        .buttons button:focus-visible {
            outline: 2px solid white;
            outline-offset: 3px;
        }

        footer {
            text-align: center;
            padding: 25px 15px;
            border-top: 1px solid var(--border);
            color: var(--muted);
            font-size: 12px;
        }

        @media (max-width: 480px) {
            .navbar {
                padding: 20px 16px;
            }

            .logo {
                font-size: 20px;
            }

            .nav-text {
                font-size: 10px;
            }

            main {
                padding: 45px 15px 65px;
            }

            .page-heading {
                margin-bottom: 35px;
            }

            .calculator {
                padding: 20px;
            }

            .buttons {
                gap: 10px;
            }

            .buttons button {
                font-size: 17px;
            }

            .display-container input {
                height: 75px;
                font-size: 28px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .buttons button {
                transition: none;
            }
        }
    </style>
</head>

<body>
    <header>
        <div class="navbar">
            <div class="logo">VELIX<span>.</span></div>
            <div class="nav-text">CALCULATOR</div>
        </div>
    </header>

    <main>
        <div class="page-heading">
            <p>JAVASCRIPT PROJECT</p>
            <h1>VELIX <span>CALCULATOR.</span></h1>
            <p class="description">
                Simple. Clean. Functional.
            </p>
        </div>

        <section class="calculator">
            <div class="calculator-top">
                <span class="calculator-name">VELIX CALC</span>
                <span class="calculator-model">STANDARD</span>
            </div>

            <div class="display-container">
                <input
                    type="text"
                    placeholder="0"
                    aria-label="Calculator display"
                    readonly
                >
            </div>

            <div class="buttons">
                <button class="function">AC</button>
                <button class="function">%</button>
                <button class="function">DEL</button>
                <button class="operator">/</button>

                <button>7</button>
                <button>8</button>
                <button>9</button>
                <button class="operator">*</button>

                <button>4</button>
                <button>5</button>
                <button>6</button>
                <button class="operator">−</button>

                <button>1</button>
                <button>2</button>
                <button>3</button>
                <button class="operator">+</button>

                <button>00</button>
                <button>0</button>
                <button>.</button>
                <button class="equal">=</button>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Velix Calculator. Designed & Developed by Lukman.</p>
    </footer>

    <script src="index.js"></script>
</body>

</html>
